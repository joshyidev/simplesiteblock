<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SimpleSiteBlock</title>
    <link rel="icon" type="image/png" sizes="32x32" href="../../icons/icon32.png">
    <link rel="stylesheet" href="./popup.css">
  </head>
  <body>
    <main class="popup">
      <div class="popup-summary" aria-label="SimpleSiteBlock">
        <img class="popup-icon" src="../../icons/icon128.png" alt="" width="56" height="56">
        <div>
          <p id="extensionName" class="popup-name">SimpleSiteBlock</p>
          <p id="extensionVersion" class="popup-version"></p>
        </div>
      </div>
      <button id="openOptions" type="button">Open options</button>
    </main>
    <script type="module" src="./popup.js"></script>
  </body>
</html>
